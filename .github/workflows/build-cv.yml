name: CV CI

on:
  push:
    branches: [main]
    paths:
      - "cv.tex"
      - "tex/**"
      - "sections/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/build-cv.yml"
  pull_request:
    paths:
      - "cv.tex"
      - "tex/**"
      - "sections/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile with pinned TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          texlive_version: 2025
          os: debian
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Validate output
        run: make verify PDF=cv.pdf EXPECTED_PAGES=2

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: yipeng-xu-cv-${{ github.sha }}
          path: cv.pdf
          if-no-files-found: error
          retention-days: 14
