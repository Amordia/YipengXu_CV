name: Publish CV PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cv.tex"
      - "src/**"
      - "Makefile"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: publish-cv-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile with pinned TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          texlive_version: 2025
          os: debian
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Validate and stage canonical PDF
        run: |
          make verify PDF=cv.pdf EXPECTED_PAGES=2
          cp cv.pdf Yipeng_Xu_CV.pdf

      - name: Commit PDF only when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yipeng_Xu_CV.pdf
          if git diff --cached --quiet; then
            echo "Canonical PDF is already up to date."
          else
            git commit -m "build: publish latest CV PDF [skip ci]"
            git push
          fi
